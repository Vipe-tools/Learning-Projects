<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <!-- Titel der Webseite -->
    <title>HTML & CSS Bewegungsübung</title>

    <!-- CSS-Datei einbinden -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Überschrift -->
    <h1>HTML & CSS Formen</h1>

    <!-- Hauptbereich für unsere Übung -->
    <div class="spielfeld">

        <!-- Einfacher Text -->
        <div class="text">
            Dieser Text wird von Formen überdeckt
        </div>

        <!-- Rotes Quadrat -->
        <div class="form rot"></div>

        <!-- Blauer Kreis -->
        <div class="form blau"></div>

        <!-- Grünes Quadrat -->
        <div class="form gruen"></div>

        <!-- Gelber Kreis -->
        <div class="form gelb"></div>

        <!-- Lila Rechteck -->
        <div class="form lila"></div>

        <!-- Form mit Farbwechsel -->
        <div class="form farbwechsel"></div>

        <!-- Form die sich dreht -->
        <div class="form drehend"></div>

        <!-- Form die sich größer und kleiner macht -->
        <div class="form pulsierend"></div>

        <!-- Form die sich diagonal bewegt -->
        <div class="form diagonal"></div>

        <!-- Form die sich im Kreis bewegt -->
        <div class="form kreisbahn"></div>

    </div>

</body>
</html>
